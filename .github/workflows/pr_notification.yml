name: Discord Notification on Pull Request

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

jobs:
  discord_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_TYPE: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          USER_LOGIN: ${{ github.event.sender.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord Webhook URL is not set."
            exit 1
          fi

          if [ "$EVENT_TYPE" = "opened" ]; then
            MESSAGE="🚀 <@324551085320830986> New Pull Request: [$PR_TITLE]($PR_URL) by $USER_LOGIN"
          elif [ "$EVENT_TYPE" = "synchronize" ]; then
            MESSAGE="🔄 <@324551085320830986> Pull Request Updated: [$PR_TITLE]($PR_URL) by $USER_LOGIN"
          else
            echo "Unsupported event type: $EVENT_TYPE"
            exit 1
          fi

          # Build JSON with jq so quotes in the title can't inject fields,
          # and only allow the fixed user mention (no @everyone / role pings from titles).
          jq -n --arg content "$MESSAGE" \
            '{content: $content, allowed_mentions: {parse: [], users: ["324551085320830986"]}}' \
            | curl -fsS -H "Content-Type: application/json" -X POST --data-binary @- "$DISCORD_WEBHOOK_URL"
